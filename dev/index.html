<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Panoreel Editor</title>
  <style>
    html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; display: block; }
    body { overflow: hidden; }
  </style>
</head>
<body>
  <iframe id="editor" title="Panoreel editor" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      params.set('mode', 'edit');
      params.set('dev', '1');
      document.getElementById('editor').src = '../?' + params.toString() + window.location.hash;
    })();
  </script>
</body>
</html>
